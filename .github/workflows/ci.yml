name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/autocomplete-system

jobs:

  # 1) Backend: все Java-сервисы
  backend:
    name: Backend Services
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [common, autocomplete-service, search-service, cdc-service]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: ./mvnw -q -DskipTests package

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: ./mvnw -q test

      - name: Spotless check
        working-directory: ${{ matrix.service }}
        run: ./mvnw spotless:check || true

      - name: Flyway validate (search-service only)
        if: matrix.service == 'search-service'
        working-directory: search-service
        run: ./mvnw -q flyway:validate

  # 2) Frontend: Angular
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build Angular
        working-directory: frontend
        run: npm run build --if-present

      - name: Test
        working-directory: frontend
        run: npm test --if-present

  # 3) Docker: сборка и пуш образов
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push images
        run: |
          SERVICES="autocomplete-service search-service cdc-service frontend"
          for SVC in $SERVICES; do
            IMAGE="${REGISTRY}/${IMAGE_PREFIX}-${SVC}:latest"
            echo "Building $IMAGE"
            docker build -t $IMAGE $SVC
            docker push $IMAGE
          done

  # 4) Deploy: миграции + регистрация Debezium
  deploy:
    name: Apply Migrations & Register Debezium
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Apply Flyway migrations (search-service)
        working-directory: search-service
        env:
          FLYWAY_URL: ${{ secrets.DB_URL }}
          FLYWAY_USER: ${{ secrets.DB_USER }}
          FLYWAY_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ./mvnw -q flyway:migrate \
            -Dflyway.url=${FLYWAY_URL} \
            -Dflyway.user=${FLYWAY_USER} \
            -Dflyway.password=${FLYWAY_PASSWORD}

      - name: Register Debezium Connector
        env:
          KAFKA_CONNECT_URL: ${{ secrets.KAFKA_CONNECT_URL }}
        run: |
          echo "Registering Debezium connector at ${KAFKA_CONNECT_URL}..."
          curl -X POST -H "Content-Type: application/json" \
            --data @infra/debezium/connector-config.json \
            ${KAFKA_CONNECT_URL}/connectors

      - name: Summary
        run: |
          echo "## CI/CD Completed" >> $GITHUB_STEP_SUMMARY
          echo "### Backend services: OK" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend: OK" >> $GITHUB_STEP_SUMMARY
          echo "### Docker images pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "### Flyway migrations applied" >> $GITHUB_STEP_SUMMARY
          echo "### Debezium connector registered" >> $GITHUB_STEP_SUMMARY