<div class="container">
  <h1>Autocomplete Demo</h1>

  <form (ngSubmit)="onSubmit()" class="search-form">
    <input
      data-testid="search-input"
      type="text"
      [value]="query"
      (input)="onInputChange($event.target.value)"
      placeholder="Type your query..."
      autocomplete="off"
    />
    <button type="submit">Search</button>
  </form>

  <ul class="suggestions" *ngIf="showSuggestions" data-testid="suggestions-list">
    <li *ngFor="let s of suggestions$ | async">
      <button data-testid="suggestion-item" type="button" (click)="onSelectSuggestion(s)">
        {{ s.query }}
      </button>
    </li>
  </ul>
</div>
